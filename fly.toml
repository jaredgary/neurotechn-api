# =====================================================================
# Fly.io Configuration - Backend FastAPI
# Sistema Predictivo de Inventario Farmacéutico
# Versión: 2.0.0 - SaaS Genérico con Cálculo Dinámico
# =====================================================================

app = 'farmacias-siman-api'

# Región: Miami (más cercana a Honduras - ~1400km)
# Alternativas: dfw (Dallas ~1800km), iad (Virginia ~2500km)
primary_region = 'mia'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Configuración de aplicación
  LOG_LEVEL = 'INFO'
  PORT = '8000'
  DEBUG = 'false'

  # Umbrales de negocio (configurables)
  LEAD_TIME_BUFFER_DAYS = '2'
  SAFETY_STOCK_THRESHOLD = '1.0'
  MIN_CONFIDENCE_THRESHOLD = '0.70'
  RISK_CRITICAL_DAYS = '7'
  RISK_HIGH_DAYS = '10'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # Health checks (RNF-003: ≥99% disponibilidad)
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

  # Concurrency settings
  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

# VM Configuration (económica para MVP)
[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

# Auto-scaling
[deploy]
  strategy = 'rolling'

# Secrets (configurar via fly secrets set)
# fly secrets set SUPABASE_URL=https://xxx.supabase.co
# fly secrets set SUPABASE_KEY=eyJhbGc...
# fly secrets set SUPABASE_SERVICE_KEY=eyJhbGc...

# Métricas y logging
[[metrics]]
  port = 8000
  path = '/health'

# Statics (opcional para documentación)
[[statics]]
  guest_path = '/app/static'
  url_prefix = '/static'
