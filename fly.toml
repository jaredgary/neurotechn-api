# fly.toml app configuration file generated for neurotechn-api on 2025-08-30T14:33:21Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'neurotechn-api'
primary_region = 'mia'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[processes]
  app = "/opt/venv/bin/gunicorn -w 4 -k uvicorn.workers.UvicornWorker src.main:app"
  worker = "/opt/venv/bin/celery -A src.celery_app worker --loglevel=info -Q forecast,alerts,maintenance"