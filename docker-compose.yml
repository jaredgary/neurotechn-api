version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    environment:
      # Core Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      
      # Security
      - SECRET_KEY=${SECRET_KEY}
      - CRON_SECRET=${CRON_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      
      # Redis/Celery (usar nombres de servicio Docker)
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      
      # Model config
      - FORECAST_HORIZONS=${FORECAST_HORIZONS}
      - TRAINING_WINDOW_DAYS=${TRAINING_WINDOW_DAYS}
      - MIN_TRAINING_SAMPLES=${MIN_TRAINING_SAMPLES}
      - XGBOOST_N_ESTIMATORS=${XGBOOST_N_ESTIMATORS}
      - XGBOOST_MAX_DEPTH=${XGBOOST_MAX_DEPTH}
      - XGBOOST_LEARNING_RATE=${XGBOOST_LEARNING_RATE}
      - XGBOOST_RANDOM_STATE=${XGBOOST_RANDOM_STATE}
      
      # Alerts
      - ALERT_CHECK_INTERVAL_HOURS=${ALERT_CHECK_INTERVAL_HOURS}
      - ALERT_STOCK_CRITICAL_THRESHOLD=${ALERT_STOCK_CRITICAL_THRESHOLD}
      - ALERT_EXPIRY_DAYS_CRITICAL=${ALERT_EXPIRY_DAYS_CRITICAL}
      
      # App config
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: celery -A src.celery_app worker --loglevel=info --concurrency=2
    environment:
      # Todas las mismas variables que api
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FORECAST_HORIZONS=${FORECAST_HORIZONS}
      - TRAINING_WINDOW_DAYS=${TRAINING_WINDOW_DAYS}
      - MIN_TRAINING_SAMPLES=${MIN_TRAINING_SAMPLES}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      - redis
      - api

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: celery -A src.celery_app beat --loglevel=info --scheduler=django_celery_beat.schedulers:DatabaseScheduler
    environment:
      # Mismas variables que celery-worker
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
      - api

volumes:
  redis_data:

networks:
  default:
    name: farmacias_siman_network